# Render Blueprint: create the service from this repo in the Render dashboard (New > Blueprint).
# --workers 1: update progress is kept in memory, so there must be exactly one worker process.
services:
  - type: web
    name: fm27-tactic-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: REFRESH_TOKEN          # generated by Render; read it under Environment to use the Update button
        generateValue: true
      - key: YOUTUBE_API_KEY        # optional; leave empty to skip YouTube
        sync: false
